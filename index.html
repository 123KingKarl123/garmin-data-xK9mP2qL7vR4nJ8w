<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garmin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --surface2: #1e2026;
    --border: #2a2d35;
    --text: #e8eaf0;
    --muted: #6b7280;
    --accent: #4ade80;
    --accent2: #60a5fa;
    --accent3: #f472b6;
    --accent4: #fb923c;
    --warn: #facc15;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 300; min-height: 100vh; }

  /* grid noise texture */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0;
  }

  .shell { max-width: 900px; margin: 0 auto; padding: 2rem 1.25rem; position: relative; z-index: 1; }

  /* header */
  header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1rem; }
  .logo { display: flex; flex-direction: column; gap: 2px; }
  .logo-title { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .15em; text-transform: uppercase; }
  .logo-name { font-size: 22px; font-weight: 500; color: var(--text); }
  .race-chip { background: var(--surface); border: 0.5px solid var(--border); border-radius: 8px; padding: .6rem 1rem; text-align: right; }
  .race-chip .days { font-family: var(--mono); font-size: 28px; font-weight: 500; color: var(--accent); line-height: 1; }
  .race-chip .race-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* range tabs */
  .range-row { display: flex; gap: 6px; margin-bottom: 1.75rem; }
  .range-btn { font-family: var(--mono); font-size: 11px; padding: 5px 12px; border-radius: 6px; border: 0.5px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; letter-spacing: .05em; transition: all .15s; }
  .range-btn.on { background: var(--surface2); color: var(--text); border-color: var(--accent); }

  /* metric grid */
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 2rem; }
  .metric { background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: .9rem 1rem; }
  .metric-label { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  .metric-value { font-size: 24px; font-weight: 500; color: var(--text); line-height: 1; }
  .metric-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .metric-value.green { color: var(--accent); }
  .metric-value.blue { color: var(--accent2); }
  .metric-value.pink { color: var(--accent3); }
  .metric-value.orange { color: var(--accent4); }

  /* tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 1.25rem; flex-wrap: wrap; border-bottom: 0.5px solid var(--border); padding-bottom: 0; }
  .tab { font-family: var(--mono); font-size: 11px; padding: 7px 14px; border-radius: 6px 6px 0 0; border: none; background: transparent; color: var(--muted); cursor: pointer; letter-spacing: .05em; text-transform: uppercase; border-bottom: 2px solid transparent; transition: all .15s; }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }

  /* chart area */
  .chart-panel { background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1.5rem; }
  .chart-panel h3 { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 1rem; }
  .chart-wrap { position: relative; height: 220px; }

  /* activity list */
  .act-row { display: flex; align-items: center; gap: 10px; padding: .7rem .9rem; background: var(--surface2); border-radius: 8px; margin-bottom: 6px; }
  .act-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .act-type { font-size: 13px; font-weight: 500; color: var(--text); min-width: 110px; text-transform: capitalize; }
  .act-stat { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .act-date { margin-left: auto; font-size: 11px; color: var(--muted); font-family: var(--mono); }

  /* ── training plan ── */
  .plan-today-pin { background: #0a1f12; border: 1px solid var(--accent); border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 1.2rem; position: relative; }
  .plan-today-pin::before { content: 'TODAY'; font-family: var(--mono); font-size: 9px; letter-spacing: .12em; color: var(--accent); display: block; margin-bottom: 6px; }
  .plan-phase-header { display: flex; align-items: center; gap: 10px; margin: 1.4rem 0 .6rem; }
  .plan-phase-label { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; flex: 1; padding-bottom: 4px; border-bottom: 0.5px solid var(--border); }
  .plan-phase-pill { font-family: var(--mono); font-size: 9px; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
  .phase-1 { background: #0d2e1e; color: var(--accent); }
  .phase-2 { background: #0d2235; color: #60aaff; }
  .phase-3 { background: #1e1230; color: #b08aff; }
  .phase-4 { background: #2a1500; color: var(--accent4); }
  .phase-5 { background: #1a1010; color: #f87171; }
  .plan-history-toggle { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: .08em; cursor: pointer; background: none; border: 0.5px solid var(--border); border-radius: 5px; padding: 2px 8px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .plan-history-toggle:hover { color: var(--text); border-color: var(--muted); }
  .plan-history-block { overflow: hidden; transition: max-height .35s ease; }
  .plan-history-block.collapsed { max-height: 0; }
  .plan-history-block.expanded { max-height: 9999px; }
  .plan-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: .85rem 1rem; margin-bottom: 7px; display: flex; gap: 12px; align-items: flex-start; transition: border-color .2s; }
  .plan-card.is-past { opacity: .55; }
  .plan-card.is-past.done-card { opacity: .7; }
  .plan-card.today { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(52,211,153,.08); }
  .plan-card.race-day { border-color: var(--accent4); background: #1a1510; }
  .plan-card.missed-card { border-color: #7f1d1d; }
  .plan-card.rescheduled-card { border-color: #60aaff; background: #060f1a; }
  .plan-date-col { min-width: 78px; }
  .plan-date { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .plan-day { font-size: 12px; font-weight: 500; color: var(--text); margin-top: 2px; }
  .plan-content { flex: 1; min-width: 0; }
  .plan-badges { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 5px; }
  .plan-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
  .plan-detail { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .plan-note { font-size: 11px; color: var(--muted); margin-top: 4px; font-style: italic; opacity: .7; }
  .plan-badge { font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 4px; letter-spacing: .04em; display: inline-block; }
  .bz2 { background: #0d2e1e; color: var(--accent); }
  .bmx { background: #2a1a0a; color: var(--accent4); }
  .brs { background: #1e1e22; color: var(--muted); }
  .btp { background: #161230; color: var(--accent2); }
  .brc { background: #2a1205; color: var(--accent4); }
  .bmissed { background: #2d0a0a; color: #f87171; }
  .bdone { background: #0d2e1e; color: var(--accent); }
  .brescheduled { background: #060f1a; color: #60aaff; }
  .plan-segs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .plan-seg { font-size: 10px; font-family: var(--mono); padding: 2px 6px; border-radius: 4px; border: 0.5px solid var(--border); color: var(--muted); }
  .plan-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .plan-done-btn { font-family: var(--mono); font-size: 10px; padding: 3px 10px; border-radius: 5px; cursor: pointer; border: 0.5px solid var(--border); background: transparent; color: var(--muted); letter-spacing: .04em; transition: all .15s; }
  .plan-done-btn:hover { border-color: var(--accent); color: var(--accent); }
  .plan-done-btn.done { background: #0d2e1e; color: var(--accent); border-color: var(--accent); }
  .plan-missed-btn { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 5px; cursor: pointer; border: 0.5px solid #7f1d1d; background: transparent; color: #f87171; letter-spacing: .04em; }
  .plan-adapt-btn { font-family: var(--mono); font-size: 10px; padding: 3px 10px; border-radius: 5px; cursor: pointer; border: 0.5px solid var(--accent); background: #0d2e1e; color: var(--accent); letter-spacing: .04em; display: flex; align-items: center; gap: 4px; }
  .plan-adapt-btn.loading { opacity: .6; pointer-events: none; }
  .plan-replan-panel { background: #060f1a; border: 1px solid #60aaff33; border-radius: 8px; padding: .75rem; margin-top: 8px; font-size: 12px; color: var(--text); line-height: 1.6; }
  .plan-replan-panel p { margin: 0 0 6px; }
  .plan-replan-panel p:last-child { margin: 0; }
  @media(max-width:600px) { .plan-card { flex-direction: column; gap: 6px; } .plan-date-col { min-width: unset; } }

  /* heatmap filter + mode buttons */
  .hf-btn { font-family: var(--mono); font-size: 10px; padding: 3px 10px; border-radius: 5px; cursor: pointer; border: 0.5px solid var(--border); background: transparent; color: var(--muted); letter-spacing: .04em; }
  .hf-btn.on { background: var(--surface2); color: var(--text); border-color: var(--accent); }
  .hf-btn.mode-btn { padding: 3px 12px; }
  .hf-btn.mode-btn.on { background: #0d2235; color: #60aaff; border-color: #60aaff; }
  .heatmap-filters { display: flex; gap: 4px; }

  /* status */
  .status { text-align: center; padding: 3rem; font-family: var(--mono); font-size: 12px; color: var(--muted); }

  /* progress bar */
  .prog { margin-bottom: 1.5rem; }
  .prog-labels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 5px; letter-spacing: .05em; }
  .prog-bar { height: 3px; background: var(--surface2); border-radius: 2px; }
  .prog-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s ease; }

  /* updated */
  .updated { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: right; margin-bottom: 1rem; letter-spacing: .05em; }

  @media(max-width:600px) {
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .plan-card { flex-direction: column; gap: 6px; }
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="logo">
      <span class="logo-title">Health dashboard</span>
      <span class="logo-name">Good morning 👋</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
      <div class="race-chip">
        <div class="days" id="daysLeft">—</div>
        <div class="race-label" id="raceLabel">days to race</div>
      </div>
      <div id="nextEvent"></div>
    </div>
  </header>

  <div class="updated" id="updatedLabel">Fetching data...</div>

  <div class="range-row">
    <button class="range-btn" onclick="setRange(7)">7D</button>
    <button class="range-btn on" onclick="setRange(30)">30D</button>
    <button class="range-btn" onclick="setRange(90)">90D</button>
  </div>

  <div id="statusMsg" class="status">Loading your Garmin data from GitHub...</div>

  <div id="mainContent" style="display:none">
    <div class="metrics" id="metricsGrid"></div>

    <div class="tabs">
      <button class="tab on" onclick="showTab('activities')">Activities</button>
      <button class="tab" onclick="showTab('steps')">Steps</button>
      <button class="tab" onclick="showTab('sleep')">Sleep</button>
      <button class="tab" onclick="showTab('hrv')">HRV</button>
      <button class="tab" onclick="showTab('stress')">Stress</button>
      <button class="tab" onclick="showTab('hr')">Heart rate</button>
      <button class="tab" onclick="showTab('plan')">Race plan</button>
      <button class="tab" onclick="showTab('training')">Training status</button>
      <button class="tab" onclick="showTab('heatmap')">Heatmap</button>
    </div>

    <div id="tabContent"></div>
  </div>

  <!-- Daily AI Insight -->
  <div class="insight-box" id="insightBox">
    <div class="insight-header">
      <span class="insight-title">
        ✦ Daily insight
        <span class="insight-badge">AI powered</span>
      </span>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="insight-date" id="insightDate"></span>
        <button class="insight-refresh" onclick="generateInsight(true)">↻ Refresh</button>
      </div>
    </div>
    <div id="insightContent">
      <div class="insight-loading">
        <div class="insight-dot"></div>
        <div class="insight-dot"></div>
        <div class="insight-dot"></div>
        <span style="margin-left:4px">Analysing yesterday's data...</span>
      </div>
    </div>
  </div>

</div>

<script>
const GH = 'https://raw.githubusercontent.com/123KingKarl123/garmin-data-xK9mP2qL7vR4nJ8w/main/';
const FILES = ['activities.csv','daily_summaries.csv','sleep.csv','hrv.csv','resting_heart_rate.csv','stress.csv'];
let D = {};
let days = 30;
let curTab = 'activities';
let chart = null;

// ── race countdown ──────────────────────────────────────────
const racesList = [
  { title: 'Essar Chester Half Marathon', date: '2026-05-17', distance: '21.1km' },
  { title: 'MBNA Chester Marathon', date: '2026-10-11', distance: '42.2km' },
];
const todayRace = new Date(); todayRace.setHours(0,0,0,0);
const nextCountdownRace = racesList
  .filter(r => new Date(r.date) >= todayRace)
  .sort((a,b) => new Date(a.date) - new Date(b.date))[0];
const daysLeft = nextCountdownRace ? Math.round((new Date(nextCountdownRace.date) - todayRace) / 86400000) : 0;
document.getElementById('daysLeft').textContent = daysLeft;
const rlEl = document.getElementById('raceLabel');
if (rlEl && nextCountdownRace) {
  const words = nextCountdownRace.title.split(' ');
  rlEl.textContent = 'days to ' + words.slice(-2).join(' ');
}

// Upcoming race events — add/remove races here as needed
const raceEvents = [
  { title: 'Essar Chester Half Marathon', date: '2026-05-17', distance: '21.1km' },
  { title: 'MBNA Chester Marathon', date: '2026-10-11', distance: '42.2km' },
];
const today2 = new Date(); today2.setHours(0,0,0,0);
const nextRace = raceEvents
  .filter(e => new Date(e.date) >= today2)
  .sort((a,b) => new Date(a.date) - new Date(b.date))[0];
if (nextRace) {
  const dtr = Math.round((new Date(nextRace.date) - today2) / 86400000);
  const nel = document.getElementById('nextEvent');
  if (nel) nel.innerHTML = `<div class="race-chip" style="text-align:left;margin-top:6px">
    <div style="font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:.05em;margin-bottom:3px">NEXT RACE</div>
    <div style="font-size:13px;font-weight:500;color:var(--text)">${nextRace.title}</div>
    <div style="font-size:11px;color:var(--muted);margin-top:2px">${nextRace.date} · ${nextRace.distance} · ${dtr} days away</div>
  </div>`;
}

// ── CSV parser (handles both comma and tab separated) ───────
function parseCSV(txt) {
  const lines = txt.trim().split('\n');
  if (lines.length < 2) return [];
  // Auto-detect delimiter: tab or comma
  const delim = lines[0].includes('\t') ? '\t' : ',';
  const hdrs = lines[0].split(delim).map(h => h.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line => {
    if (delim === '\t') {
      // Tab-separated: simple split, no quote handling needed
      const vals = line.split('\t');
      const o = {};
      hdrs.forEach((h,i) => o[h]=(vals[i]||'').replace(/^"|"$/g,'').trim());
      return o;
    }
    // Comma-separated with quote handling
    const vals = []; let cur = '', inQ = false;
    for (const c of line) {
      if (c==='"') inQ=!inQ;
      else if (c===',' && !inQ) { vals.push(cur); cur=''; }
      else cur+=c;
    }
    vals.push(cur);
    const o = {};
    hdrs.forEach((h,i) => o[h]=(vals[i]||'').replace(/^"|"$/g,'').trim());
    return o;
  });
}

function cutoff(n) { const d=new Date(); d.setDate(d.getDate()-n); return d; }
function filterRows(rows, field, n) {
  const c=cutoff(n);
  return rows.filter(r=>r[field]&&new Date(r[field])>=c).sort((a,b)=>a[field]>b[field]?1:-1);
}
function findCol(row, opts) { if(!row) return null; for(const o of opts) if(row[o]!==undefined) return o; return null; }
function avg(arr) { const f=arr.filter(Boolean); return f.length?Math.round(f.reduce((a,b)=>a+b,0)/f.length):0; }

// ── fetch all ───────────────────────────────────────────────
async function loadAll() {
  try {
    const results = await Promise.all(FILES.map(f =>
      fetch(GH+f+'?t='+Date.now())
        .then(r=>r.ok?r.text():'').then(t=>t?parseCSV(t):[]).catch(()=>[])
    ));
    D.activities=results[0]; D.daily=results[1]; D.sleep=results[2];
    D.hrv=results[3]; D.hr=results[4]; D.stress=results[5];

    if (!D.daily.length && !D.activities.length) {
      document.getElementById('statusMsg').textContent='No data found. Check your GitHub Actions workflow has run.';
      return;
    }
    document.getElementById('statusMsg').style.display='none';
    document.getElementById('mainContent').style.display='';
    // Fetch actual last commit timestamp from GitHub API
    fetch('https://api.github.com/repos/123KingKarl123/garmin-data-xK9mP2qL7vR4nJ8w/commits?path=activities.csv&per_page=1')
      .then(r=>r.json())
      .then(data=>{
        if(data && data[0] && data[0].commit){
          const d = new Date(data[0].commit.committer.date);
          const fmt = d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}) + ' at ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
          document.getElementById('updatedLabel').textContent='Last synced: ' + fmt;
        } else {
          document.getElementById('updatedLabel').textContent='Last synced: unknown';
        }
      })
      .catch(()=>{ document.getElementById('updatedLabel').textContent='Last synced: unknown'; });
    renderMetrics();
    showTab('activities');
  } catch(e) {
    document.getElementById('statusMsg').textContent='Error: '+e.message;
  }
}

// ── metrics ─────────────────────────────────────────────────
function renderMetrics() {
  const daily=filterRows(D.daily||[],'date',days);
  const sleep=filterRows(D.sleep||[],'date',days);
  const hrv=filterRows(D.hrv||[],'date',days);
  const hr=filterRows(D.hr||[],'date',days);
  const acts=filterRows(D.activities||[],'startTimeLocal',days);

  const totalRunKm=acts.filter(a=>{const t=(a.activityType_typeKey||a.activityType||a.activityName||'').toLowerCase();return t.includes('run');}).reduce((s,a)=>s+(parseFloat(a.distance)||0)/1000,0);
  const totalCycleKm=acts.filter(a=>{const t=(a.activityType_typeKey||a.activityType||a.activityName||'').toLowerCase();return t.includes('cycl')||t.includes('bike')||t.includes('ride');}).reduce((s,a)=>s+(parseFloat(a.distance)||0)/1000,0);

  const sc=findCol(daily[0],['totalSteps','steps']);
  const cc=findCol(daily[0],['totalKilocalories','activeKilocalories','calories']);
  const slc=findCol(sleep[0],['sleepTimeSeconds','dailySleepDTO_sleepTimeSeconds','totalSleepTimeInSeconds']);
  const hvc=findCol(hrv[0],['hrvSummary_lastNightAvg','lastNight','weeklyAvg']);
  function parseHRval(r){
    const rowStr = Object.values(r).join(',');
    const m = rowStr.match(/value[^\d]+(\d+\.?\d*)/i);
    if (m && +m[1] > 20 && +m[1] < 250) return Math.round(+m[1]);
    return 0;
  }
  const hrc=findCol(hr[0],['allMetrics_metricsMap_WELLNESS_RESTING_HEART_RATE','value','restingHeartRate']);
  const stc=findCol((D.stress||[])[0],['averageStressLevel','avgStressLevel']);

  const avgSteps=sc?avg(daily.map(r=>+r[sc]||0)):0;
  const avgCals=cc?avg(daily.map(r=>+r[cc]||0)):0;
  const avgSleep=slc?(avg(sleep.map(r=>+r[slc]||0))/3600).toFixed(1):'—';
  const avgHrv=hvc?avg(hrv.map(r=>+r[hvc]||0)):0;
  const avgHr=avg(hr.map(r=>parseHRval(r)));
  const avgStress=stc?avg(filterRows(D.stress||[],'date',days).map(r=>+r[stc]||0)):0;

}

// ── chart helper ─────────────────────────────────────────────
function makeChart(id, type, labels, datasets, extraOpts={}) {
  if(chart) chart.destroy();
  const ctx=document.getElementById(id);
  if(!ctx) return;
  chart=new Chart(ctx,{
    type, data:{labels,datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#6b7280',font:{size:10},maxRotation:45,autoSkip:true,maxTicksLimit:14},grid:{color:'#1e2026'}},
        y:{ticks:{color:'#6b7280',font:{size:10}},grid:{color:'rgba(255,255,255,0.04)'}},
        ...extraOpts
      }
    }
  });
}

// ── tabs ─────────────────────────────────────────────────────
function showTab(name) {
  curTab=name;
  document.querySelectorAll('.tab').forEach((b,i)=>{
    b.classList.toggle('on',['activities','steps','sleep','hrv','stress','hr','plan'][i]===name);
  });
  const el=document.getElementById('tabContent');
  if(chart){chart.destroy();chart=null;}

  if(name==='activities') { renderActivities(el); return; }
  if(name==='plan') { renderPlan(el); return; }
  if(name==='heatmap') { renderHeatmap(el); return; }
  if(name==='training') { renderTraining(el); return; }

  const cfg={
    steps:{
      title:'Daily steps & calories',
      build:()=>{
        const rows=filterRows(D.daily||[],'date',days);
        const sc=findCol(rows[0],['totalSteps','steps']);
        const cc=findCol(rows[0],['totalKilocalories','activeKilocalories']);
        return {labels:rows.map(r=>r.date.slice(5)),
          ds:[{label:'Steps',data:rows.map(r=>+r[sc]||0),backgroundColor:'#4ade8066',borderColor:'#4ade80',borderWidth:1,yAxisID:'y'},
              {label:'Calories',data:rows.map(r=>+r[cc]||0),backgroundColor:'#fb923c66',borderColor:'#fb923c',borderWidth:1,yAxisID:'y1'}],
          extra:{y1:{position:'right',ticks:{color:'#6b7280',font:{size:10}},grid:{display:false}}}};
      }
    },
    sleep:{
      title:'Sleep duration (hours)',
      build:()=>{
        const rows=filterRows(D.sleep||[],'date',days);
        const c=findCol(rows[0],['sleepTimeSeconds','dailySleepDTO_sleepTimeSeconds','totalSleepTimeInSeconds']);
        return {labels:rows.map(r=>r.date.slice(5)),
          ds:[{label:'Sleep',data:rows.map(r=>c?+(+r[c]/3600).toFixed(1):0),backgroundColor:'#f472b666',borderColor:'#f472b6',borderWidth:1}],extra:{}};
      }
    },
    hrv:{
      title:'HRV (ms) with baseline range',
      build:()=>{
        const rows=filterRows(D.hrv||[],'date',days);
        const labels=rows.map(r=>r.date.slice(5));
        const hrv=rows.map(r=>+r['hrvSummary_lastNightAvg']||0);
        const avg7=rows.map(r=>+r['hrvSummary_weeklyAvg']||0);
        const baseLow=rows.map(r=>+r['hrvSummary_baseline_balancedLow']||0);
        const baseHigh=rows.map(r=>+r['hrvSummary_baseline_balancedUpper']||0);
        return {labels, ds:[
          {label:'Baseline low',data:baseLow,borderColor:'rgba(74,222,128,0.25)',backgroundColor:'rgba(74,222,128,0.12)',fill:'+1',tension:.35,pointRadius:0,order:4,borderWidth:1},
          {label:'Baseline high',data:baseHigh,borderColor:'rgba(74,222,128,0.25)',backgroundColor:'rgba(74,222,128,0.12)',fill:false,tension:.35,pointRadius:0,order:3,borderWidth:1},
          {label:'7d avg',data:avg7,borderColor:'#60a5fa',backgroundColor:'transparent',borderWidth:1.5,borderDash:[4,3],tension:.35,pointRadius:0,order:2},
          {label:'Overnight HRV',data:hrv,borderColor:'#4ade80',backgroundColor:'transparent',fill:false,tension:.35,pointRadius:3,pointBackgroundColor:'#4ade80',borderWidth:2,order:1},
        ],extra:{}};
      }
    },
    stress:{
      title:'Average daily stress',
      build:()=>{
        const rows=filterRows(D.stress||[],'date',days);
        const c=findCol(rows[0],['averageStressLevel','avgStressLevel','overallStressLevel']);
        return {labels:rows.map(r=>r.date.slice(5)),
          ds:[{label:'Stress',data:rows.map(r=>c?+r[c]||0:0),borderColor:'#fb923c',backgroundColor:'#fb923c18',fill:true,tension:.35,pointRadius:2}],extra:{}};
      }
    },
    hr:{
      title:'Resting heart rate (bpm)',
      build:()=>{
        const rows=filterRows(D.hr||[],'date',days);
        function parseHR(r){
          // The raw CSV row contains the HR value - search entire stringified row
          const rowStr = Object.values(r).join(',');
          const m = rowStr.match(/value[^\d]+(\d+\.?\d*)/i);
          if (m && +m[1] > 20 && +m[1] < 250) return Math.round(+m[1]);
          return 0;
        }
        return {labels:rows.map(r=>r.date.slice(5)),
          ds:[{label:'Resting HR',data:rows.map(r=>parseHR(r)),borderColor:'#f472b6',backgroundColor:'#f472b618',fill:true,tension:.35,pointRadius:2,pointBackgroundColor:'#f472b6'}],extra:{}};
      }
    }
  };

  const c=cfg[name];
  if(!c){el.innerHTML='';return;}
  const built=c.build();
  const chartType=name==='steps'?'bar':name==='sleep'?'bar':'line';
  const showLegend = name==='hrv';
  const legendHtml = name==='hrv' ? `<div style="display:flex;gap:16px;margin-bottom:10px;font-size:11px;color:var(--muted);font-family:var(--mono)">
    <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;background:#4ade80;border-radius:2px;display:inline-block"></span>Overnight HRV</span>
    <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:3px;background:#60a5fa;display:inline-block"></span>7d avg</span>
    <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;background:rgba(74,222,128,0.2);border-radius:2px;display:inline-block"></span>Baseline</span>
  </div>` : '';
  el.innerHTML=`<div class="chart-panel"><h3>${c.title}</h3>${legendHtml}<div class="chart-wrap"><canvas id="mainChart"></canvas></div></div>`;
  makeChart('mainChart',chartType,built.labels,built.ds,built.extra);
}

function renderActivities(el) {
  const acts=filterRows(D.activities||[],'startTimeLocal',days).reverse().slice(0,20);
  if(!acts.length){el.innerHTML='<div class="status">No activities in this period.</div>';return;}
  const icons={'running':'🏃','cycling':'🚴','swimming':'🏊','walking':'🚶','strength_training':'🏋️','default':'⚡'};
  el.innerHTML=acts.map(a=>{
    const type=(a.activityType_typeKey||a.activityType||a.activityName||'activity').replace(/_/g,' ');
    const icon=icons[Object.keys(icons).find(k=>type.includes(k))||'default'];
    const dist=a.distance?(parseFloat(a.distance)/1000).toFixed(2)+'km':'';
    const dur=a.duration?Math.round(parseFloat(a.duration)/60)+'min':'';
    const hr2=a.averageHR?a.averageHR+' bpm avg':'';
    const date=(a.startTimeLocal||'').slice(0,10);
    return `<div class="act-row">
      <div class="act-icon" style="background:var(--surface2)">${icon}</div>
      <span class="act-type">${type}</span>
      ${dist?`<span class="act-stat">${dist}</span>`:''}
      ${dur?`<span class="act-stat">${dur}</span>`:''}
      ${hr2?`<span class="act-stat">${hr2}</span>`:''}
      <span class="act-date">${date}</span>
    </div>`;
  }).join('');
}

// ── plan state ───────────────────────────────────────────────
let planDone={};
try{planDone=JSON.parse(localStorage.getItem('chesterMarathon2026')||'{}');}catch(e){}
let planMissed={};
try{planMissed=JSON.parse(localStorage.getItem('chesterMarathon2026_missed')||'{}');}catch(e){}
let planRescheduled={};
try{planRescheduled=JSON.parse(localStorage.getItem('chesterMarathon2026_rescheduled')||'{}');}catch(e){}
let planHistoryOpen={};  // tracks which week history blocks are expanded

function savePlanState(){
  try{
    localStorage.setItem('chesterMarathon2026',JSON.stringify(planDone));
    localStorage.setItem('chesterMarathon2026_missed',JSON.stringify(planMissed));
    localStorage.setItem('chesterMarathon2026_rescheduled',JSON.stringify(planRescheduled));
  }catch(e){}
}

function togglePlanDone(key){
  planDone[key]=!planDone[key];
  if(planDone[key]) delete planMissed[key];
  savePlanState();
  renderPlan(document.getElementById('tabContent'));
}

function markMissed(key,title){
  planMissed[key]=title;
  delete planDone[key];
  savePlanState();
  renderPlan(document.getElementById('tabContent'));
}

function unmarkMissed(key){
  delete planMissed[key];
  savePlanState();
  renderPlan(document.getElementById('tabContent'));
}

function toggleHistory(weekKey){
  // accept either a string key or a DOM element (via this.dataset.wk)
  if(typeof weekKey==='object') weekKey=weekKey.dataset.wk;
  planHistoryOpen[weekKey]=!planHistoryOpen[weekKey];
  const block=document.getElementById('history-'+weekKey);
  const btn=document.getElementById('histbtn-'+weekKey);
  if(block){
    block.classList.toggle('collapsed',!planHistoryOpen[weekKey]);
    block.classList.toggle('expanded',!!planHistoryOpen[weekKey]);
  }
  if(btn){
    const isWeekHistory=btn.textContent.includes('week');
    btn.textContent=planHistoryOpen[weekKey]
      ?(isWeekHistory?'▲ hide earlier this week':'▲ hide history')
      :(isWeekHistory?'▼ show earlier this week':'▼ show history');
  }
}

// ── replanning engine ─────────────────────────────────────────
// Build a flat list of all plan days in order
function flatPlanDays(){
  const days=[];
  planWeeks.forEach(w=>w.days.forEach(d=>days.push({...d,weekLabel:w.label,phase:w.phase})));
  return days;
}

function localToday(){
  const now=new Date();
  return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
}

async function replanFromMissed(missedDate, missedTitle, btnEl){
  if(btnEl){ btnEl.classList.add('loading'); btnEl.textContent='⟳ Replanning...'; }

  const allDays=flatPlanDays();
  const today=localToday();
  const raceDate='2026-10-11';
  const daysLeft=Math.round((new Date(raceDate)-new Date(today))/86400000);

  // Build context: what's upcoming from today
  const upcoming=allDays.filter(d=>d.date>=today&&d.date!==raceDate&&d.type!=='brs').slice(0,14);
  const upcomingStr=upcoming.map(d=>`${d.date} (${d.day}): ${d.title}`).join('\n');

  // All current missed sessions
  const allMissed=Object.keys(planMissed).map(k=>`${k}: ${planMissed[k]}`).join('\n');

  const ANTHROPIC_KEY=window.ANTHROPIC_KEY||'';
  if(!ANTHROPIC_KEY){
    showReplanResult(missedDate,'No Anthropic API key set. Set <code>window.ANTHROPIC_KEY</code> on the page.');
    if(btnEl){btnEl.classList.remove('loading');btnEl.textContent='↻ Replan with Claude';}
    return;
  }

  const prompt=`You are Karl's running coach. He is training for the MBNA Chester Marathon on 11 October 2026 (${daysLeft} days away), targeting sub-4 hours (5:40/km). He is in a 20-week structured plan.

Today is ${today}. Karl has missed:
${allMissed}

His upcoming scheduled sessions (next 14 training days):
${upcomingStr}

His weekly structure: Mon recovery, Tue threshold/intervals, Wed easy+strength, Thu steady/marathon pace, Fri rest, Sat easy+strides, Sun long run.

Give a practical replanning response in exactly 3 paragraphs:
1. What the missed session(s) mean for his fitness and training load — honest but brief.
2. Exactly how to adjust the NEXT 7 DAYS — name specific days and modified sessions. Be precise: e.g. "Move Thursday's 12km steady to Wednesday and drop it to 10km."
3. One recovery or nutrition priority to support getting back on track.

No bullet points. Max 180 words. Use Karl's name once.`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':ANTHROPIC_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:500,messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    const text=data.content?.[0]?.text||'No response.';
    showReplanResult(missedDate,text);
  }catch(e){
    showReplanResult(missedDate,'Error: '+e.message);
  }
  if(btnEl){btnEl.classList.remove('loading');btnEl.textContent='↻ Replan with Claude';}
}

function showReplanResult(dateKey,text){
  const panel=document.getElementById('replan-'+dateKey);
  if(!panel)return;
  const paras=text.split(/\n+/).filter(Boolean).map(p=>`<p>${p}</p>`).join('');
  panel.innerHTML=paras;
  panel.style.display='block';
}

function totalPlanSessions(){let t=0;planWeeks.forEach(w=>w.days.forEach(d=>{if(d.type!=='brs')t++;}));return t;}
function donePlanCount(){return Object.values(planDone).filter(Boolean).length;}



function renderPlan(el){
  const today=localToday();
  function isPast(d){ return d<today; }
  function isToday2(d){ return d===today; }
  function fmtDate(ds){
    const [y,m,dd]=ds.split('-').map(Number);
    return new Date(y,m-1,dd).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  }
  function phaseClass(phase){
    if(!phase) return 'phase-1';
    const n=phase.match(/Phase\s*(\d)/i);
    return n?'phase-'+n[1]:'phase-1';
  }
  function buildCard(d,opts){
    opts=opts||{};
    const pinned=opts.pinned||false;
    const isDone=!!planDone[d.date];
    const isMissed=!!planMissed[d.date];
    const isRace=d.type==='brc';
    const isPast2=isPast(d.date);
    const isTod=isToday2(d.date);
    const isActionable=d.type!=='brs'&&!isRace;
    const isRescheduled=!!planRescheduled[d.date];
    const safeTitle=d.title.replace(/'/g,"\'").replace(/"/g,'&quot;');
    let cardCls='plan-card';
    if(isTod&&!pinned) cardCls+=' today';
    if(isRace) cardCls+=' race-day';
    if(isMissed) cardCls+=' missed-card';
    if(isRescheduled&&!isMissed) cardCls+=' rescheduled-card';
    if(isPast2&&!isTod) cardCls+=' is-past';
    if(isPast2&&isDone) cardCls+=' done-card';
    const badges='<span class="plan-badge '+d.type+'">'+d.badge+'</span>'
      +(isDone?'<span class="plan-badge bdone">\u2713 Done</span>':'')
      +(isMissed?'<span class="plan-badge bmissed">\u2717 Missed</span>':'')
      +(isRescheduled&&!isMissed?'<span class="plan-badge brescheduled">\u21bb Rescheduled</span>':'');
    const segsHtml=d.segs&&d.segs.length
      ?'<div class="plan-segs">'+d.segs.map(function(s){return '<span class="plan-seg">'+s+'</span>';}).join('')+'</div>':'';
    const noteHtml=d.note?'<div class="plan-note">'+d.note+'</div>':'';
    let actionsHtml='';
    if(isActionable&&!isMissed){
      actionsHtml='<div class="plan-actions">'
        +'<button class="plan-done-btn'+(isDone?' done':'')+'" onclick="togglePlanDone(\"'+d.date+'\")">'+(isDone?'✓ Completed':'Mark done')+'</button>'
        +((isPast2||isTod)&&!isDone?'<button class="plan-missed-btn" onclick="markMissed(\"'+d.date+'\",\"'+safeTitle+'\")">✗ Missed</button>':'')
        +'</div>';
    } else if(isMissed){
      actionsHtml='<div class="plan-actions">'
        +'<button class="plan-adapt-btn" id="replan-btn-'+d.date+'" onclick="replanFromMissed(\"'+d.date+'\",\"'+safeTitle+'\",this)">↻ Replan with Claude</button>'
        +'<button class="plan-missed-btn" style="opacity:.6" onclick="unmarkMissed(\"'+d.date+'\")"">Undo</button>'
        +'</div>'
        +'<div class="plan-replan-panel" id="replan-'+d.date+'" style="display:none"></div>';
    }
    return '<div class="'+cardCls+'">'
      +'<div class="plan-date-col">'
        +'<div class="plan-date">'+fmtDate(d.date)+'</div>'
        +'<div class="plan-day">'+(isTod&&!pinned?d.day+' \u00b7 Today':d.day)+'</div>'
      +'</div>'
      +'<div class="plan-content">'
        +'<div class="plan-badges">'+badges+'</div>'
        +'<div class="plan-title">'+d.title+'</div>'
        +'<div class="plan-detail">'+d.detail+'</div>'
        +segsHtml+noteHtml+actionsHtml
      +'</div></div>';
  }

  // progress bar
  const total=totalPlanSessions(), done=donePlanCount(), pct=Math.round((done/total)*100);
  const missedCount=Object.keys(planMissed).length;
  let html='<div class="prog">'
    +'<div class="prog-labels"><span>'+done+' of '+total+' sessions done'+(missedCount>0?' &middot; <span style="color:#f87171">'+missedCount+' missed</span>':'')+'</span><span>'+pct+'%</span></div>'
    +'<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div>'
    +'</div>';

  // find today entry
  var todayEntry=null;
  planWeeks.forEach(function(w){ w.days.forEach(function(d){ if(d.date===today){ todayEntry=d; } }); });

  // pinned today / next session card
  if(todayEntry){
    html+='<div class="plan-today-pin">'+buildCard(todayEntry,{pinned:true})+'</div>';
  } else {
    var allDays=flatPlanDays();
    var next=null; for(var i=0;i<allDays.length;i++){ if(allDays[i].date>today){next=allDays[i];break;} }
    if(next) html+='<div class="plan-today-pin" style="border-color:var(--border)"><div style="font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.1em;margin-bottom:6px">NEXT SESSION</div>'+buildCard(next,{pinned:true})+'</div>';
  }

  // weeks
  planWeeks.forEach(function(w,wi){
    var wDays=w.days;
    var pastDays=wDays.filter(function(d){return isPast(d.date)&&!isToday2(d.date);});
    var futureDays=wDays.filter(function(d){return !isPast(d.date)||isToday2(d.date);});
    var weekStart=wDays.length?wDays[0].date:'';
    var weekEnd=wDays.length?wDays[wDays.length-1].date:'';
    var weekContainsToday=wDays.some(function(d){return isToday2(d.date);});
    var weekIsEntirelyPast=weekEnd<today;
    var histKey='w'+wi;
    var isOpen=!!planHistoryOpen[histKey];
    var phasePill=w.phase?'<span class="plan-phase-pill '+phaseClass(w.phase)+'">'+w.phase+'</span>':'';

    html+='<div class="plan-phase-header">'
      +'<span class="plan-phase-label">'+w.label+'</span>'
      +phasePill
      +(weekIsEntirelyPast?'<button class="plan-history-toggle" id="histbtn-'+histKey+'" onclick="toggleHistory(this.dataset.wk)" data-wk="'+histKey+'">'+(isOpen?'\u25b2 hide history':'\u25bc show history')+'</button>':'')
      +'</div>';

    if(weekIsEntirelyPast){
      var doneCnt=wDays.filter(function(d){return planDone[d.date];}).length;
      var missedCnt=wDays.filter(function(d){return planMissed[d.date];}).length;
      var trainable=wDays.filter(function(d){return d.type!=='brs'&&d.type!=='brc';}).length;
      html+='<div class="plan-history-block '+(isOpen?'expanded':'collapsed')+'" id="history-'+histKey+'">';
      html+='<div style="font-family:var(--mono);font-size:10px;color:var(--muted);padding:4px 2px;display:flex;gap:12px">'
        +'<span style="color:var(--accent)">\u2713 '+doneCnt+'/'+trainable+' done</span>'
        +(missedCnt>0?'<span style="color:#f87171">\u2717 '+missedCnt+' missed</span>':'')
        +'</div>';
      wDays.forEach(function(d){ html+=buildCard(d); });
      html+='</div>';
    } else if(weekContainsToday){
      if(pastDays.length>0){
        var histKey2='w'+wi+'p';
        var isOpen2=!!planHistoryOpen[histKey2];
        html+='<div style="margin-bottom:4px"><button class="plan-history-toggle" id="histbtn-'+histKey2+'" onclick="toggleHistory(this.dataset.wk)" data-wk="'+histKey2+'">'+(isOpen2?'\u25b2 hide earlier this week':'\u25bc show earlier this week')+'</button></div>';
        html+='<div class="plan-history-block '+(isOpen2?'expanded':'collapsed')+'" id="history-'+histKey2+'">';
        pastDays.forEach(function(d){ if(!isToday2(d.date)) html+=buildCard(d); });
        html+='</div>';
      }
      futureDays.forEach(function(d){ if(!isToday2(d.date)) html+=buildCard(d); });
    } else {
      wDays.forEach(function(d){ html+=buildCard(d); });
    }
  });

  el.innerHTML=html;
}

async function generateInsight(force=false) {
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);

  document.getElementById('insightDate').textContent = 'Based on ' + yesterday.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  document.getElementById('insightContent').innerHTML = `<div class="insight-loading">
    <div class="insight-dot"></div><div class="insight-dot"></div><div class="insight-dot"></div>
    <span style="margin-left:4px">Loading today's insight...</span>
  </div>`;

  try {
    const res = await fetch(GH + 'insight.json?t=' + Date.now());
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    const paragraphs = data.insight.trim().split(/\n+/).filter(Boolean);
    const labels = ['Yesterday', "Today's session", 'Tip'];
    const html = paragraphs.map((p,i) => `
      <div class="${i>0?'insight-section':''}">
        ${i>0?`<div class="insight-section-label">${labels[i]||''}</div>`:''}
        <div class="insight-text">${p}</div>
      </div>`).join('');

  } catch(err) {
    document.getElementById('insightContent').innerHTML =
      `<div class="insight-text" style="color:var(--color-text-tertiary)">Could not load insight. Error: ${err.message}</div>`;
  }
}

    // Extract key fields using actual Garmin field names
    const deviceKey = Object.keys(d).find(k => k.includes('latestTrainingStatusData') && k.endsWith('trainingStatusFeedbackPhrase'));
    const prefix = deviceKey ? deviceKey.replace('trainingStatusFeedbackPhrase','') : '';

    const statusPhrase = d[prefix + 'trainingStatusFeedbackPhrase'] || '—';
    const acuteLoad = d[prefix + 'acuteTrainingLoadDTO_dailyTrainingLoadAcute'] || '—';
    const chronicLoad = d[prefix + 'acuteTrainingLoadDTO_dailyTrainingLoadChronic'] || '—';
    const acwrStatus = d[prefix + 'acuteTrainingLoadDTO_acwrStatus'] || '—';

    const lbKey = Object.keys(d).find(k => k.includes('trainingBalanceFeedbackPhrase'));
    const loadFocus = lbKey ? d[lbKey] : '—';

    const aerobicLow = d[Object.keys(d).find(k => k.includes('monthlyLoadAerobicLow') && !k.includes('Target'))] || 0;
    const aerobicHigh = d[Object.keys(d).find(k => k.includes('monthlyLoadAerobicHigh') && !k.includes('Target'))] || 0;
    const anaerobic = d[Object.keys(d).find(k => k.includes('monthlyLoadAnaerobic') && !k.includes('Target'))] || 0;

    const vo2max = d['mostRecentVO2Max_generic_vo2MaxValue'] || '—';
    const vo2maxPrecise = d['mostRecentVO2Max_generic_vo2MaxPreciseValue'] || '';

    const status = statusPhrase;

    function statusColor(s) {
      s = (s||'').toLowerCase();

      if (s.includes('maintain') || s.includes('recovery')) return '#60a5fa';
      if (s.includes('overreach') || s.includes('overre')) return '#f472b6';
      if (s.includes('detraining') || s.includes('unproductive')) return '#fb923c';
      return 'var(--color-text-primary)';
    }

    const statusLabels = {
      'RECOVERY_1': 'Recovery', 'RECOVERY_2': 'Recovery',
      'MAINTAINING_1': 'Maintaining', 'MAINTAINING_2': 'Maintaining',
      'PRODUCTIVE_1': 'Productive', 'PRODUCTIVE_2': 'Productive',
      'PEAKING_1': 'Peaking', 'PEAKING_2': 'Peaking',
      'OVERREACHING_1': 'Overreaching', 'OVERREACHING_2': 'Overreaching',
      'UNPRODUCTIVE': 'Unproductive', 'DETRAINING': 'Detraining'
    };
    const loadLabels = {

      'AEROBIC_LOW_SHORTAGE': 'Aerobic Low Shortage',
      'AEROBIC_HIGH_SHORTAGE': 'Aerobic High Shortage',
      'AEROBIC_LOW_EXCESS': 'Aerobic Low Excess',
      'AEROBIC_HIGH_EXCESS': 'Aerobic High Excess',
      'OPTIMAL': 'Optimal Balance',
      'BALANCED': 'Balanced'
    };

    const statusLabel = statusLabels[status] || status.replace(/_/g,' ').replace(/\w/g,c=>c.toUpperCase());
    const loadLabel = loadLabels[loadFocus] || loadFocus.replace(/_/g,' ').replace(/\w/g,c=>c.toUpperCase());
    const acwrLabel = acwrStatus.replace(/_/g,' ').replace(/\w/g,c=>c.toUpperCase());

    const totalLoad = Math.round((parseFloat(aerobicLow)||0) + (parseFloat(aerobicHigh)||0) + (parseFloat(anaerobic)||0));

    el.innerHTML = `
      <div style="margin-bottom:1.25rem">
        <div style="font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.75rem">Current training status</div>
        <div style="display:flex;align-items:center;gap:12px;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:1.25rem 1.5rem;margin-bottom:1rem">
          <div style="font-size:36px">🏃</div>
          <div>
            <div style="font-size:24px;font-weight:500;color:${statusColor(statusLabel)}">${statusLabel}</div>
            <div style="font-size:13px;color:var(--color-text-secondary);margin-top:3px">Load focus: ${loadLabel}</div>
            <div style="font-size:12px;color:var(--color-text-tertiary);margin-top:2px">Acute:Chronic ratio — ${acwrLabel}</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1rem">
          <div class="metric"><div class="metric-label">VO₂ Max</div><div class="metric-value blue">${vo2max}</div><div class="metric-sub">${vo2maxPrecise ? '(' + vo2maxPrecise + ' precise)' : 'ml/kg/min'}</div></div>
          <div class="metric"><div class="metric-label">Acute load</div><div class="metric-value green">${acuteLoad}</div><div class="metric-sub">last 7 days</div></div>
          <div class="metric"><div class="metric-label">Chronic load</div><div class="metric-value">${chronicLoad}</div><div class="metric-sub">last 28 days</div></div>
          <div class="metric"><div class="metric-label">Monthly total</div><div class="metric-value orange">${totalLoad}</div><div class="metric-sub">this month</div></div>
        </div>
        <div style="font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.5rem">Monthly load breakdown</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
          <div class="metric"><div class="metric-label">Aerobic low</div><div class="metric-value" style="font-size:16px">${Math.round(aerobicLow)}</div><div class="metric-sub">zone 1-2</div></div>
          <div class="metric"><div class="metric-label">Aerobic high</div><div class="metric-value" style="font-size:16px">${Math.round(aerobicHigh)}</div><div class="metric-sub">zone 3-4</div></div>
          <div class="metric"><div class="metric-label">Anaerobic</div><div class="metric-value" style="font-size:16px">${Math.round(anaerobic)}</div><div class="metric-sub">zone 5</div></div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--color-text-tertiary);font-style:italic">Updated daily with your morning sync</div>`;

  } catch(e) {
    el.innerHTML = '<div class="status">Training status not available yet — run the workflow to fetch it.</div>';
  }
}

// ── heatmap ──────────────────────────────────────────────────
let heatmapInstance = null;
let heatmapRoutes = [];
let activeFilter = 'all';
let heatmapMode = 'heatmap'; // 'heatmap' | 'coverage'

function decodePolyline(encoded) {
  let index = 0, lat = 0, lng = 0, coords = [];
  while (index < encoded.length) {
    let b, shift = 0, result = 0;
    do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += (result & 1) ? ~(result >> 1) : (result >> 1);
    shift = 0; result = 0;
    do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lng += (result & 1) ? ~(result >> 1) : (result >> 1);
    coords.push([lat / 1e5, lng / 1e5]);
  }
  return coords;
}

function getFilterType(type) {
  const t = (type||'').toLowerCase();
  if (t.includes('run') || t.includes('walk') || t.includes('hike')) return 'run';
  if (t.includes('ride') || t.includes('cycl') || t.includes('virtual')) return 'cycle';
  return 'other';
}

function getHeatColor(filter) {
  // Strava-style: orange/coral for runs, blue for cycles, purple for other
  if (filter === 'run') return { r: 252, g: 82, b: 0 };    // Strava orange
  if (filter === 'cycle') return { r: 0, g: 130, b: 255 };  // Strava blue
  return { r: 180, g: 100, b: 255 };                         // purple for other
}

function buildSegmentMap(routes) {
  // Count how many times each ~50m segment is covered
  // We grid the world into cells and count route passes through each
  const GRID = 1000; // grid resolution (higher = finer)
  const counts = new Map();

  routes.forEach(route => {
    if (!route.polyline) return;
    const coords = decodePolyline(route.polyline);
    for (let i = 0; i < coords.length - 1; i++) {
      const lat = Math.round((coords[i][0] + coords[i+1][0]) / 2 * GRID) / GRID;
      const lng = Math.round((coords[i][1] + coords[i+1][1]) / 2 * GRID) / GRID;
      const key = `${lat},${lng}`;
      counts.set(key, (counts.get(key) || 0) + 1);
    }
  });
  return counts;
}

async function renderHeatmap(el) {
  const heatLegend = heatmapMode === 'heatmap'
    ? '<span>🔴 Runs</span><span>🔵 Cycles</span><span>🟣 Other</span><span style="margin-left:8px">Brighter + thicker = more times covered</span>'
    : '<span>🟠 Runs</span><span>🔵 Cycles</span><span>🟣 Other</span><span style="margin-left:8px">Every unique road or trail you have ever covered</span>';

  el.innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px">
      <div class="heatmap-filters" id="hmFilters" style="margin-bottom:0">
        <button class="hf-btn ${activeFilter==='all'?'on':''}" onclick="filterHeatmap('all')">All</button>
        <button class="hf-btn ${activeFilter==='run'?'on':''}" onclick="filterHeatmap('run')">Runs</button>
        <button class="hf-btn ${activeFilter==='cycle'?'on':''}" onclick="filterHeatmap('cycle')">Cycles</button>
        <button class="hf-btn ${activeFilter==='other'?'on':''}" onclick="filterHeatmap('other')">Other</button>
      </div>
      <div style="display:flex;gap:4px;margin-left:auto">
        <button class="hf-btn mode-btn ${heatmapMode==='heatmap'?'on':''}" onclick="setHeatmapMode('heatmap')" title="Density heatmap — brighter where you run more often">🔥 Heatmap</button>
        <button class="hf-btn mode-btn ${heatmapMode==='coverage'?'on':''}" onclick="setHeatmapMode('coverage')" title="Coverage map — every road or trail you have ever covered">🗺 Coverage</button>
      </div>
    </div>
    <div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:6px;padding-left:2px;display:flex;gap:16px;flex-wrap:wrap">
      ${heatLegend}
    </div>
    <div id="heatmapContainer" style="height:460px;width:100%;display:block;position:relative;z-index:0;"></div>`;

  if (!heatmapRoutes.length) {
    try {
      const res = await fetch(GH + 'strava_routes.json?t=' + Date.now());
      if (!res.ok) throw new Error('not found');
      heatmapRoutes = await res.json();
    } catch(e) {
      el.innerHTML = '<div class="status">No Strava route data found. Run the workflow to fetch your routes.</div>';
      return;
    }
  }

  if (heatmapInstance) { heatmapInstance.remove(); heatmapInstance = null; }

  const container = document.getElementById('heatmapContainer');
  container.style.height = '460px';
  container.style.width = '100%';

  heatmapInstance = L.map('heatmapContainer', { zoomControl: true, scrollWheelZoom: true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', maxZoom: 19
  }).addTo(heatmapInstance);

  // Filter routes
  const filtered = activeFilter === 'all'
    ? heatmapRoutes
    : heatmapRoutes.filter(r => getFilterType(r.type) === activeFilter);

  if (!filtered.length) {
    container.innerHTML = '<div class="status">No routes for this filter.</div>';
    return;
  }

  const allCoords = [];

  if (heatmapMode === 'heatmap') {
    // ── HEATMAP MODE: density-weighted opacity & thickness ──
    const segCounts = buildSegmentMap(filtered);
    const maxCount = Math.max(...segCounts.values());

    filtered.forEach(route => {
      if (!route.polyline) return;
      const coords = decodePolyline(route.polyline);
      if (!coords.length) return;
      allCoords.push(...coords);

      let totalCount = 0, segCount = 0;
      for (let i = 0; i < coords.length - 1; i++) {
        const lat = Math.round((coords[i][0] + coords[i+1][0]) / 2 * 1000) / 1000;
        const lng = Math.round((coords[i][1] + coords[i+1][1]) / 2 * 1000) / 1000;
        totalCount += segCounts.get(`${lat},${lng}`) || 1;
        segCount++;
      }
      const avgCoverage = segCount > 0 ? totalCount / segCount : 1;
      const ratio = Math.min(avgCoverage / Math.max(maxCount * 0.6, 1), 1);
      const typeFilter = activeFilter === 'all' ? getFilterType(route.type) : activeFilter;
      const col = getHeatColor(typeFilter);
      const opacity = 0.06 + ratio * 0.88;
      const weight = 0.8 + ratio * 3;
      const color = `rgba(${col.r},${col.g},${col.b},${opacity.toFixed(2)})`;

      if (ratio > 0.4) {
        L.polyline(coords, {
          color: `rgba(${col.r},${col.g},${col.b},${(opacity * 0.3).toFixed(2)})`,
          weight: weight * 3, lineCap: 'round', lineJoin: 'round'
        }).addTo(heatmapInstance);
      }
      L.polyline(coords, { color, weight, lineCap: 'round', lineJoin: 'round' })
        .bindPopup(`<b>${route.name}</b><br>${route.type} · ${(route.distance/1000).toFixed(1)}km<br>${route.date}`)
        .addTo(heatmapInstance);
    });

  } else {
    // ── COVERAGE MODE: deduplicate segments, show every unique road bold & solid ──
    // Build a set of unique segments across all routes at ~25m resolution
    const GRID = 4000;
    const seen = new Set();
    // We still draw per-route but skip segment cells already drawn
    // This makes every road you've ever covered show as one bold line

    filtered.forEach(route => {
      if (!route.polyline) return;
      const coords = decodePolyline(route.polyline);
      if (!coords.length) return;
      allCoords.push(...coords);
    });

    // Deduplicate: merge all routes into unique segment cells, then draw as one layer per type
    const typeGroups = { run: [], cycle: [], other: [] };
    filtered.forEach(route => {
      if (!route.polyline) return;
      const coords = decodePolyline(route.polyline);
      const ft = getFilterType(route.type);
      const group = typeGroups[ft] || typeGroups.other;
      // Build unique segments for this route
      const uniqueSegs = [];
      let seg = [];
      for (let i = 0; i < coords.length; i++) {
        const lat = Math.round(coords[i][0] * GRID) / GRID;
        const lng = Math.round(coords[i][1] * GRID) / GRID;
        const key = `${ft}:${lat},${lng}`;
        if (!seen.has(key)) {
          seen.add(key);
          seg.push(coords[i]);
        } else {
          if (seg.length > 1) uniqueSegs.push(seg);
          seg = [];
        }
      }
      if (seg.length > 1) uniqueSegs.push(seg);
      uniqueSegs.forEach(s => group.push(s));
    });

    // Draw each type group as bold solid lines with a glow underneath
    const coverageColors = {
      run:   { main: 'rgba(255,100,20,0.95)',  glow: 'rgba(255,120,40,0.25)' },
      cycle: { main: 'rgba(30,140,255,0.95)',  glow: 'rgba(30,140,255,0.22)' },
      other: { main: 'rgba(180,80,255,0.95)',  glow: 'rgba(180,80,255,0.22)' },
    };

    Object.entries(typeGroups).forEach(([type, segs]) => {
      if (!segs.length) return;
      const c = coverageColors[type];
      segs.forEach(seg => {
        if (seg.length < 2) return;
        // Glow layer
        L.polyline(seg, { color: c.glow, weight: 10, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(heatmapInstance);
        // Bold solid line on top
        L.polyline(seg, { color: c.main, weight: 3.5, lineCap: 'round', lineJoin: 'round' }).addTo(heatmapInstance);
      });
    });
  }

  if (allCoords.length) {
    heatmapInstance.fitBounds(allCoords);
  }
}

function filterHeatmap(type) {
  activeFilter = type;
  const el = document.getElementById('tabContent');
  if (heatmapInstance) { heatmapInstance.remove(); heatmapInstance = null; }
  renderHeatmap(el);
}

function setHeatmapMode(mode) {
  heatmapMode = mode;
  const el = document.getElementById('tabContent');
  if (heatmapInstance) { heatmapInstance.remove(); heatmapInstance = null; }
  renderHeatmap(el);
}

loadAll();
generateInsight();
